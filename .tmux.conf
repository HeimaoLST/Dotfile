# 1. 主前缀改为 Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# 2. 默认 shell（按平台选择 zsh 路径）
if-shell '[ "$(uname)" = "Darwin" ]' \
  'set-option -g default-shell /bin/zsh ; set-option -g default-command /bin/zsh' \
  'set-option -g default-shell /usr/bin/zsh ; set-option -g default-command /usr/bin/zsh'

# 3. 256 色 + 真彩色
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 4. 鼠标 + 扩展键 + 图形透传
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on

# 修复核心：开启 vi 键位，且鼠标拖动选中松开后【不】回弹底部
setw -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane

# macOS 专属联动：在复制模式下，按 "y" 或 "Enter" 复制到 macOS 系统剪贴板
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# 5. 状态栏布局
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# 单窗口时隐藏状态栏，多窗口时自动显示
set -g status off
set-hook -g window-linked   "if-shell -F '#{>:#{session_windows},1}' 'set -g status on'"
set-hook -g window-unlinked "if-shell -F '#{<:#{session_windows},2}' 'set -g status off'"

# ============================================================
# Plugins (TPM)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'HeimaoLST/rose-pine-tmux'

# Rose Pine Dawn + 自定义 powerline 块状外观
set -g @rose_pine_variant 'dawn'
set -g @rose_pine_blocks 'on'
set -g @rose_pine_host 'on'
set -g @rose_pine_block_date '%Y-%m-%d'
set -g @rose_pine_block_time '%H:%M'

# TPM 自举：首次启动若未安装则自动 clone 并装插件
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
